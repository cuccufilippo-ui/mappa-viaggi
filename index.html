<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mappa Viaggi</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;height:100vh;display:flex}aside{width:380px;max-width:43vw;display:flex;flex-direction:column;background:#fff;border-right:1px solid #ddd}header{padding:14px;border-bottom:1px solid #ddd}h1{margin:0 0 5px;font-size:21px}#count{font-size:12px;color:#666;margin-bottom:9px}input[type=search]{width:100%;padding:9px;border:1px solid #bbb;border-radius:7px}.item{display:flex;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid #eee;font-size:13px;cursor:pointer}.item:hover{background:#f5f7fa}.item input{width:17px;height:17px}.num{background:#333;color:#fff;border-radius:50%;min-width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;font-size:10px}.name{flex:1}.done{text-decoration:line-through;color:#888}#list{overflow:auto;flex:1}#map{flex:1}.add{padding:9px;border-top:1px solid #ddd}.add button{width:100%;padding:9px;border:0;border-radius:7px;background:#222;color:white;cursor:pointer}.leaflet-popup-content{font-size:13px}@media(max-width:700px){body{display:block}aside{position:absolute;z-index:1000;width:100%;max-width:none;height:42vh;bottom:0;border-right:0;border-top:1px solid #ddd}#map{height:58vh}}</style></head><body><aside><header><h1>🌍 Mappa Viaggi</h1><div id="count">Caricamento…</div><input id="search" type="search" placeholder="Cerca un luogo…"></header><div id="list"></div><div class="add"><button id="add">＋ Aggiungi luogo</button></div></aside><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://stayygwqojrnsseckjrc.supabase.co",SUPABASE_KEY="sb_publishable_RLhP1PeM_vQSZHC34cLKHQ_FwCKmJGQ";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const map=L.map("map").setView([35,10],3);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);let places=[],markers={};
const defaultIcon=new L.Icon.Default();
const greenIcon=L.icon({
  iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",
  shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34],shadowSize:[41,41]
});
function syncMarker(p){ if(markers[p.id]) markers[p.id].setIcon(p.visited?greenIcon:defaultIcon); }const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");function count(){let d=places.filter(x=>x.visited).length;document.querySelector("#count").textContent=`${d} / ${places.length} visitati`}function render(){let f=document.querySelector("#search").value.toLowerCase(),list=document.querySelector("#list");list.innerHTML="";places.forEach((p,i)=>{if(f&&!p.name.toLowerCase().includes(f))return;let row=document.createElement("div");row.className="item";row.innerHTML=`<input type="checkbox" ${p.visited?"checked":""}><span class="num">${i+1}</span><span class="name ${p.visited?"done":""}">${esc(p.name)}</span>`;row.querySelector("input").onchange=async e=>{p.visited=e.target.checked;row.querySelector(".name").classList.toggle("done",p.visited);count();let u=await sb.from("places").update({visited:p.visited}).eq("id",p.id);if(u.error){p.visited=!p.visited;e.target.checked=p.visited;row.querySelector(".name").classList.toggle("done",p.visited);count();alert("Impossibile salvare la selezione: "+u.error.message);return}syncMarker(p)};row.onclick=e=>{if(e.target.tagName==="INPUT")return;if(markers[p.id]){map.setView(markers[p.id].getLatLng(),Math.max(map.getZoom(),8));markers[p.id].openPopup()}};list.appendChild(row)});count()}async function geocode(p){if(p.lat&&p.lon){addMarker(p);return}try{let r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(p.query||p.name),{headers:{"Accept-Language":"it"}}),d=await r.json();if(d.length){p.lat=+d[0].lat;p.lon=+d[0].lon;await sb.from("places").update({lat:p.lat,lon:p.lon}).eq("id",p.id);addMarker(p)}}catch(e){}}function addMarker(p){if(markers[p.id]){syncMarker(p);return}markers[p.id]=L.marker([p.lat,p.lon],{icon:p.visited?greenIcon:defaultIcon}).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.query||p.name)}">Apri in Google Maps</a>`)}async function load(){let r=await sb.from("places").select("*").order("id");if(r.error){document.querySelector("#count").textContent="Errore database: "+r.error.message;return}places=r.data;render();for(const p of places){if(!p.lat||!p.lon){await geocode(p);await new Promise(x=>setTimeout(x,1100))}else addMarker(p)}}document.querySelector("#search").oninput=render;document.querySelector("#add").onclick=async()=>{let name=prompt("Nome del nuovo luogo:");if(!name)return;let q=prompt("Località/indirizzo per posizionarlo sulla mappa:",name);let r=await sb.from("places").insert({name,query:q||name}).select().single();if(r.data){places.push(r.data);render();await geocode(r.data)}};load();</script></body></html>
