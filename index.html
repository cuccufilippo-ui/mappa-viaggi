<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f172a"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Mappa Viaggi</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-title" content="Mappa Viaggi">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--visited:#16a34a;--pending:#2563eb;--highlight:#fff3b0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden;opacity:0;animation:appFade .55s ease-out forwards}
@keyframes appFade{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes statIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes itemIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes markerPop{0%{opacity:0;filter:drop-shadow(0 0 0 rgba(0,0,0,0))}45%{opacity:1;filter:drop-shadow(0 8px 7px rgba(0,0,0,.35))}100%{opacity:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}}
@keyframes splashGlobe{0%{transform:scale(.25) rotate(-25deg);opacity:0}55%{transform:scale(1.18) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes splashOut{0%{opacity:1;visibility:visible}80%{opacity:1}100%{opacity:0;visibility:hidden;pointer-events:none}}
#splash{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#0f172a,#1e3a5f);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;animation:splashOut 1.9s ease forwards}
#splash .globe{font-size:74px;filter:drop-shadow(0 12px 25px rgba(0,0,0,.35));animation:splashGlobe .8s cubic-bezier(.2,.85,.25,1.2) both}
#splash .sTitle{font-size:27px;font-weight:850;margin-top:13px;letter-spacing:-.03em;animation:statIn .5s .45s both}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
#app{height:100%;display:flex}
aside{width:390px;max-width:44vw;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:1000;transition:transform .25s ease;animation:panelIn .55s ease-out .08s both}
.top{padding:16px 16px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
.iconBtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 7px}
.stat{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:11px;padding:7px 8px 6px;box-shadow:0 2px 8px rgba(15,23,42,.05);animation:statIn .45s ease-out both}.stat:nth-child(1){animation-delay:.12s}.stat:nth-child(2){animation-delay:.18s}.stat:nth-child(3){animation-delay:.24s}.stat:nth-child(4){animation-delay:.30s}.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#cbd5e1}.stat-visited::after{background:#22c55e}.stat-todo::after{background:#3b82f6}.stat-results::after{background:#f59e0b}
.stat b{display:block;font-size:16px;line-height:1.05;letter-spacing:-.02em}
.stat span{font-size:9px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;transition:.18s ease;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.filter:hover{transform:translateY(-1px)}.filter.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 5px 12px rgba(15,23,42,.16)}
#search{width:100%;margin-top:8px;padding:10px 12px;border:1px solid #cfd4dc;border-radius:12px;font-size:14px;background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(15,23,42,.04);outline:none}#search:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(59,130,246,.10)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted)}
.smartControls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.smartControls select,.smartControls button{min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 9px;font-size:11px;font-weight:650;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.toolRow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.toolRow button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 3px;font-size:15px;cursor:pointer;transition:.18s ease}.toolRow button:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,.08)}
.distance{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.popupMeta{font-size:11px;color:#64748b;margin:4px 0 7px}
body.dark{--bg:#07111f;--panel:#111827;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#2563eb;--highlight:#263449}
body.dark .top,body.dark .bottom,body.dark .item{background:#111827}
body.dark .item:hover{background:#172033}
body.dark .stat,body.dark .num,body.dark .badge{background:#1f2937;color:#d1d5db}
body.dark .badge.done{background:#14532d;color:#bbf7d0}
body.dark #search,body.dark .iconBtn{background:#1f2937;color:#fff;border-color:#4b5563}
body.dark .leaflet-popup-content-wrapper,body.dark .leaflet-popup-tip{background:#111827;color:#f3f4f6}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.pending{background:var(--pending)} .dot.visited{background:var(--visited)}
#list{overflow:auto;flex:1;scroll-behavior:smooth}
.item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid #eef2f7;cursor:pointer;transition:.16s;background:#fff;animation:itemIn .28s ease-out both}.item:nth-child(even){background:#fbfdff}
.item:hover{background:#f1f5f9;transform:translateX(2px)}
.item.active{background:var(--highlight);box-shadow:inset 4px 0 0 var(--accent);font-weight:700}
.item input{width:18px;height:18px;accent-color:var(--visited);flex:0 0 auto}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:9px;background:#eef2f7;font-size:10px;font-weight:800;color:#475569}
.name{flex:1;font-size:13px;line-height:1.25}
.name.done{color:#64748b;text-decoration:none}
.badge{font-size:9px;font-weight:750;border-radius:999px;padding:4px 7px;background:#eef2f7;color:#475569;white-space:nowrap}
.badge.done{background:#dcfce7;color:#166534}
.bottom{padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
#add{width:100%;padding:11px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,#111827,#334155);color:white;font-weight:800;cursor:pointer;box-shadow:0 6px 14px rgba(15,23,42,.18)}
#map{flex:1;height:100%}
#openPanel{position:absolute;top:14px;left:14px;z-index:1100;display:none;background:#fff;color:#111827;border:1px solid #d1d5db}
.leaflet-popup-content{font-size:13px}
.leaflet-popup-content b{font-size:14px}
.empty{padding:20px;color:var(--muted);text-align:center;font-size:13px}
@media(max-width:760px){
  html,body{height:100dvh;overscroll-behavior:none}
  #app{display:block;height:100dvh}
  #map{height:100dvh}
  aside{
    position:absolute;left:0;top:0;bottom:0;
    width:min(94vw,410px);max-width:none;
    box-shadow:8px 0 25px rgba(0,0,0,.16);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    animation:none!important;
    transform:translateX(-103%);
    pointer-events:none
  }
  aside:not(.closed){transform:translateX(0);pointer-events:auto}
  aside.closed{transform:translateX(-103%);pointer-events:none}
  #openPanel{display:none;pointer-events:auto;
    top:calc(12px + env(safe-area-inset-top));
    left:calc(12px + env(safe-area-inset-left));
    width:46px;height:46px;border-radius:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.18)
  }
  .top{padding:14px 14px 12px}
  .titleRow h1{font-size:20px}
  .stats{grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
  .stat{padding:5px 4px}
  .stat b{font-size:14px}
  .stat span{font-size:8px}
  .controls{gap:6px}
  .filter{min-height:40px;padding:9px 12px;font-size:13px}
  #search{font-size:16px;min-height:44px;padding:11px 12px}
  .item{min-height:52px;padding:11px 12px}
  .item input{width:20px;height:20px}
  .name{font-size:14px}
  .badge{font-size:10px}
  #add{min-height:46px;font-size:15px}
  .iconBtn{min-width:44px;min-height:44px}
  .leaflet-control-zoom a{width:42px;height:42px;line-height:42px;font-size:22px}
  .leaflet-control-attribution{font-size:9px}
}

@media(max-width:900px) and (orientation:landscape){
  aside{width:min(58vw,390px)}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="splash"><div class="globe">🌍 🏍️</div><div class="sTitle">Mappa Viaggi</div></div>
<div id="app">
  <button id="openPanel" class="iconBtn">☰</button>
  <aside id="panel">
    <div class="top">
      <div class="titleRow">
        <div><h1>🌍 🏍️ Mappa Viaggi</h1></div>
        <button id="closePanel" class="iconBtn" title="Chiudi pannello">×</button>
      </div>
      <div class="stats">
        <div class="stat stat-total"><b id="statTotal">0</b><span>Luoghi</span></div>
        <div class="stat stat-visited"><b id="statVisited">0</b><span>Visitati</span></div>
        <div class="stat stat-todo"><b id="statTodo">0</b><span>Da visitare</span></div>
        <div class="stat stat-results"><b id="statResults">0</b><span id="statResultsLabel">Risultati</span></div>
      </div>
      <div class="controls">
        <button class="filter active" data-filter="all">Tutti</button>
        <button class="filter" data-filter="visited">Visitati</button>
        <button class="filter" data-filter="todo">Da visitare</button>
      </div>
      <input id="search" type="search" placeholder="Cerca un luogo…">
      <div class="smartControls">
        <select id="areaFilter"><option value="all">🌍 Tutte le aree</option></select>
        <select id="catFilter"><option value="all">🏷️ Tutte le categorie</option></select>
      </div>
      <div class="toolRow">
        <button id="nearMe" title="Vicino a me">◎</button>
        <button id="tripMode" title="Modalità viaggio">🏍️</button>
        <button id="darkMode" title="Tema scuro">◐</button>
        <button id="exportMenu" title="Esporta CSV/GPX">⇩</button>
      </div>
      <div id="filterSummary" style="display:none;margin-top:6px;padding:6px 8px;border-radius:9px;background:#f8fafc;border:1px solid var(--line);font-size:10px;color:var(--muted);font-weight:650"></div><div class="legend">
        <span><i class="dot pending"></i>Da visitare</span>
        <span><i class="dot visited"></i>Visitato</span>
      </div>
    </div>
    <div id="list"></div>
    <div class="bottom"><button id="add">＋ Aggiungi / importa da Google Maps</button></div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://stayygwqojrnsseckjrc.supabase.co";
const SUPABASE_KEY="sb_publishable_RLhP1PeM_vQSZHC34cLKHQ_FwCKmJGQ";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const map=L.map("map",{worldCopyJump:true,zoomControl:false}).setView([45.4,9.2],6);
L.control.zoom({position:window.innerWidth<=760?"bottomright":"topleft"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);

let places=[], markers={}, rowsById={}, activeFilter="all",activeArea="all",activeCat="all",tripCenter=null,tripRadius=0,userMarker=null;
const clusterGroup=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:48,spiderfyOnMaxZoom:true});
map.addLayer(clusterGroup);
const NOVARA={lat:45.44694,lon:8.62118};
function distanceFromNovara(p){
  if(!p.lat||!p.lon)return Number.POSITIVE_INFINITY;
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(p.lat-NOVARA.lat),dLon=toRad(p.lon-NOVARA.lon);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(NOVARA.lat))*Math.cos(toRad(p.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function haversine(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function placeArea(p){
  const x=+p.lon,y=+p.lat,n=(p.name||"").toLowerCase();
  if(y>=35&&y<=47.5&&x>=6&&x<=19)return "Italia";
  if(y>=42&&y<=51.5&&x>=-5.5&&x<=9)return "Francia";
  if(y>=47&&y<=55.2&&x>=5.5&&x<=15.5)return "Germania";
  if(y>=45.5&&y<=49.2&&x>=9.3&&x<=17.2)return "Austria";
  if(y>=45.7&&y<=47.9&&x>=5.8&&x<=10.6)return "Svizzera";
  if(y>=36&&y<=44.5&&x>=-10&&x<=4.5)return "Spagna";
  if(y>=35&&y<=47&&x>=13&&x<=30)return "Balcani / Est Europa";
  if(n.includes("sard")||n.includes("olbia")||n.includes("cagliari"))return "Sardegna";
  return "Altri";
}
function placeCategory(p){
  const n=(p.name+" "+(p.query||"")).toLowerCase();
  if(/passo|col|pass|joch|gavia|stelvio|strada|route|road|gola|canyon|valico/.test(n))return "Strade e passi";
  if(/castell|castle|château|burg|fort|rocca|palazzo/.test(n))return "Castelli e storia";
  if(/spiaggia|beach|cala|mare|coast|costa|fjord|fiordo/.test(n))return "Mare e coste";
  if(/lago|lake|see|cascat|waterfall|parco|park|mont|mount|grotta|cave/.test(n))return "Natura";
  if(/muse|museum|monument|abbazia|chiesa|cathedral|duomo/.test(n))return "Cultura";
  if(/ristor|restaurant|trattoria|bar|birr|brew|café|cafe/.test(n))return "Cibo";
  return "Luoghi";
}
function sortByNovara(){
  places.sort((a,b)=>distanceFromNovara(a)-distanceFromNovara(b)||a.name.localeCompare(b.name,"it"));
}
const blueIcon=L.icon({
  iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png",
  shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34],shadowSize:[41,41]
});
const greenIcon=L.icon({
  iconUrl:"https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",
  shadowUrl:"https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34],shadowSize:[41,41]
});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

function updateStats(){
  const totalVisited=places.filter(p=>p.visited).length;
  const filtered=places.filter(p=>passesFilter(p));
  const filteredVisited=filtered.filter(p=>p.visited).length;
  document.querySelector("#statTotal").textContent=places.length;
  document.querySelector("#statVisited").textContent=filtersActive()?filteredVisited:totalVisited;
  document.querySelector("#statTodo").textContent=filtersActive()?filtered.length-filteredVisited:places.length-totalVisited;

  // Il quarto contatore ignora volutamente Tutti/Visitati/Da visitare.
  const q=document.querySelector("#search").value.trim().toLowerCase();
  const resultPlaces=places.filter(p=>{
    if(activeArea!=="all"&&placeArea(p)!==activeArea)return false;
    if(activeCat!=="all"&&placeCategory(p)!==activeCat)return false;
    if(tripCenter&&tripRadius&&haversine(tripCenter,{lat:+p.lat,lon:+p.lon})>tripRadius)return false;
    return !q||p.name.toLowerCase().includes(q);
  });
  document.querySelector("#statResults").textContent=resultPlaces.length;

  let label="Risultati";
  if(activeCat!=="all")label=activeCat;
  else if(activeArea!=="all")label=activeArea;
  else if(q)label="Ricerca";
  else if(tripCenter)label="Viaggio";
  document.querySelector("#statResultsLabel").textContent=label;
}
function passesFilter(p){
  if(activeFilter==="visited"&&!p.visited)return false;
  if(activeFilter==="todo"&&p.visited)return false;
  if(activeArea!=="all"&&placeArea(p)!==activeArea)return false;
  if(activeCat!=="all"&&placeCategory(p)!==activeCat)return false;
  if(tripCenter&&tripRadius&&haversine(tripCenter,{lat:+p.lat,lon:+p.lon})>tripRadius)return false;
  const q=document.querySelector("#search").value.trim().toLowerCase();
  return !q||p.name.toLowerCase().includes(q);
}
function filtersActive(){
  const q=document.querySelector("#search").value.trim();
  return activeFilter!=="all"||activeArea!=="all"||activeCat!=="all"||!!q||!!tripCenter;
}
function syncMarkerVisibility(){
  const useClusters=filtersActive();
  if(useClusters){
    for(const p of places){
      const m=markers[p.id]; if(!m)continue;
      if(map.hasLayer(m))map.removeLayer(m);
      const show=passesFilter(p);
      if(show&&!clusterGroup.hasLayer(m))clusterGroup.addLayer(m);
      if(!show&&clusterGroup.hasLayer(m))clusterGroup.removeLayer(m);
    }
    if(!map.hasLayer(clusterGroup))map.addLayer(clusterGroup);
  }else{
    if(map.hasLayer(clusterGroup))map.removeLayer(clusterGroup);
    clusterGroup.clearLayers();
    for(const p of places){
      const m=markers[p.id]; if(!m)continue;
      if(!map.hasLayer(m))m.addTo(map);
    }
  }
}
function syncMarker(p){
  const m=markers[p.id];
  if(m)m.setIcon(p.visited?greenIcon:blueIcon);
}
function render(){
  const list=document.querySelector("#list");
  list.innerHTML=""; rowsById={};
  const filtered=places.filter(p=>passesFilter(p));
  if(!filtered.length){list.innerHTML='<div class="empty">Nessun luogo trovato</div>'}
  filtered.forEach((p)=>{
    const row=document.createElement("div");
    row.className="item"; row.dataset.placeId=p.id; rowsById[p.id]=row;
    const idx=places.indexOf(p)+1;
    row.innerHTML=`<input type="checkbox" ${p.visited?"checked":""}>
      <span class="num">${idx}</span>
      <span class="name ${p.visited?"done":""}">${esc(p.name)}<span class="distance">${Math.round(distanceFromNovara(p))} km da Novara · ${esc(placeCategory(p))}</span></span>
      <span class="badge ${p.visited?"done":""}">${p.visited?"Visitato":"Da visitare"}</span>`;
    const cb=row.querySelector("input");
    cb.addEventListener("click",e=>e.stopPropagation());
    cb.addEventListener("change",async e=>{
      const old=p.visited;
      p.visited=e.target.checked;
      syncMarker(p); updateStats(); render(); syncMarkerVisibility();
      const {error}=await sb.from("places").update({visited:p.visited}).eq("id",p.id);
      if(error){
        p.visited=old; alert("Impossibile salvare la modifica: "+error.message);
        syncMarker(p); updateStats(); render(); syncMarkerVisibility();
      }
    });
    row.addEventListener("click",()=>{
      const m=markers[p.id];
      if(m){map.setView(m.getLatLng(),Math.max(map.getZoom(),8));m.openPopup();focusListItem(p.id);if(window.innerWidth<=760){setTimeout(()=>{document.querySelector("#panel").classList.add("closed");map.invalidateSize()},180)}}
    });
    list.appendChild(row);
  });
  updateStats();
  const fs=document.querySelector("#filterSummary");
  const labels=[];
  if(activeFilter!=="all")labels.push(activeFilter==="visited"?"Visitati":"Da visitare");
  if(activeArea!=="all")labels.push(activeArea);
  if(activeCat!=="all")labels.push(activeCat);
  const q=document.querySelector("#search").value.trim(); if(q)labels.push('“'+q+'”');
  if(tripCenter)labels.push("Modalità viaggio");
  fs.style.display=labels.length?"block":"none";
  fs.textContent=labels.length?labels.join(" · ")+" · "+places.filter(p=>passesFilter(p)).length+" risultati":"";
  syncMarkerVisibility();
}
function focusListItem(id){
  document.querySelectorAll(".item.active").forEach(el=>el.classList.remove("active"));
  const p=places.find(x=>x.id===id);
  if(!p)return;
  if(!passesFilter(p)){
    activeFilter="all";
    document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.filter==="all"));
    document.querySelector("#search").value="";
    render();
  }
  const row=rowsById[id]||document.querySelector('.item[data-place-id="'+id+'"]');
  if(row){row.classList.add("active");row.scrollIntoView({behavior:"smooth",block:"center"})}
  if(window.innerWidth<=760)document.querySelector("#panel").classList.remove("closed");
}
function addMarker(p){
  if(!p.lat||!p.lon||markers[p.id])return;
  const m=L.marker([p.lat,p.lon],{icon:p.visited?greenIcon:blueIcon});
  m.on("add",()=>{
    const el=m.getElement();
    if(el){
      el.style.animation="markerPop .68s ease-out both";
      el.style.animationDelay=(Math.random()*.35)+"s";
    }
  });
  m.bindPopup(`<b>${esc(p.name)}</b><div class="popupMeta">${p.visited?"✅ Visitato":"📍 Da visitare"} · ${Math.round(distanceFromNovara(p))} km da Novara<br>${esc(placeCategory(p))} · ${esc(placeArea(p))}</div><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.lat&&p.lon)?p.lat+","+p.lon:(p.query||p.name))}">🧭 Apri in Google Maps</a>`);
  m.on("click",()=>focusListItem(p.id));
  markers[p.id]=m;
  if(filtersActive()){if(passesFilter(p))clusterGroup.addLayer(m)}else{m.addTo(map)}
}
async function geocodeNew(p){
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(p.query||p.name),{headers:{"Accept-Language":"it"}});
    const d=await r.json();
    if(d.length){
      p.lat=+d[0].lat;p.lon=+d[0].lon;
      await sb.from("places").update({lat:p.lat,lon:p.lon}).eq("id",p.id);
      addMarker(p); render();
    }
  }catch(e){}
}
async function load(){
  const {data,error}=await sb.from("places").select("*").order("id");
  if(error){document.querySelector("#list").innerHTML='<div class="empty">Errore database: '+esc(error.message)+'</div>';return}
  places=data||[];
  buildSmartFilters();
  sortByNovara();
  render();
  map.setView([45.4,9.2],6,{animate:false});
  places.forEach((p,i)=>setTimeout(()=>addMarker(p),900+Math.min(i*5,950)));
}
function buildSmartFilters(){
  const areas=[...new Set(places.map(placeArea))].sort((a,b)=>a==="Italia"?-1:b==="Italia"?1:a==="Altri"?1:b==="Altri"?-1:a.localeCompare(b,"it")),cats=[...new Set(places.map(placeCategory))].sort((a,b)=>a.localeCompare(b,"it"));
  const a=document.querySelector("#areaFilter"),k=document.querySelector("#catFilter");
  a.innerHTML='<option value="all">🌍 Tutte le aree</option>'+areas.map(x=>'<option>'+esc(x)+'</option>').join("");
  k.innerHTML='<option value="all">🏷️ Tutte le categorie</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join("");
}
document.querySelector("#areaFilter").addEventListener("change",e=>{activeArea=e.target.value;render()});
document.querySelector("#catFilter").addEventListener("change",e=>{activeCat=e.target.value;render()});
document.querySelector("#nearMe").addEventListener("click",()=>{
  if(!navigator.geolocation){alert("Geolocalizzazione non disponibile");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    map.setView(ll,10);
    if(userMarker)map.removeLayer(userMarker);
    userMarker=L.circleMarker(ll,{radius:8,weight:3,color:"#fff",fillColor:"#2563eb",fillOpacity:1}).addTo(map).bindPopup("📍 La tua posizione").openPopup();
  },()=>alert("Consenti l'accesso alla posizione per usare Vicino a me."),{enableHighAccuracy:true,timeout:10000});
});
document.querySelector("#tripMode").addEventListener("click",()=>{
  if(tripCenter){tripCenter=null;tripRadius=0;document.querySelector("#tripMode").textContent="🏍️";render();return}
  const km=Number(prompt("Raggio della modalità viaggio in km (es. 100):","100"));
  if(!km||km<1)return;
  const cc=map.getCenter();tripCenter={lat:cc.lat,lon:cc.lng};tripRadius=km;
  document.querySelector("#tripMode").textContent="🏍️✓";render();
  alert("Modalità viaggio attiva: mostro i luoghi entro "+km+" km dal centro attuale della mappa. Premi di nuovo 🏍️ per disattivarla.");
});
document.querySelector("#darkMode").addEventListener("click",()=>{document.body.classList.toggle("dark");localStorage.setItem("mv-dark",document.body.classList.contains("dark")?"1":"0")});
if(localStorage.getItem("mv-dark")==="1")document.body.classList.add("dark");
function downloadText(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.querySelector("#exportMenu").addEventListener("click",()=>{
  const fmt=(prompt("Esporta in formato CSV o GPX?","GPX")||"").trim().toUpperCase();
  const data=places.filter(p=>passesFilter(p)&&p.lat&&p.lon);
  if(fmt==="CSV"){
    const rows=[["Nome","Latitudine","Longitudine","Stato","Categoria","Area"],...data.map(p=>[p.name,p.lat,p.lon,p.visited?"Visitato":"Da visitare",placeCategory(p),placeArea(p)])];
    downloadText("mappa-viaggi.csv",rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv");
  }else if(fmt==="GPX"){
    const xml='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Mappa Viaggi" xmlns="http://www.topografix.com/GPX/1/1">'+data.map(p=>'<wpt lat="'+p.lat+'" lon="'+p.lon+'"><name>'+esc(p.name)+'</name><desc>'+(p.visited?"Visitato":"Da visitare")+' - '+esc(placeCategory(p))+'</desc></wpt>').join("")+'</gpx>';
    downloadText("mappa-viaggi.gpx",xml,"application/gpx+xml");
  }
});
document.querySelector("#search").addEventListener("input",render);
document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
  activeFilter=btn.dataset.filter;
  document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===btn));
  render();
}));
document.querySelector("#add").addEventListener("click",async()=>{
  const first=prompt("Incolla un link Google Maps oppure scrivi il nome del luogo:");
  if(!first)return;
  let name=first,lat=null,lon=null,q=first;
  if(/^https?:\/\//i.test(first)){
    try{
      const rr=await fetch(SUPABASE_URL+"/functions/v1/resolve-google-maps?url="+encodeURIComponent(first));
      const d=await rr.json();lat=d.lat;lon=d.lon;name=d.name||"";
      name=prompt("Nome del luogo:",name||"")||name;
      if(!name)return;
      q=first;
    }catch(e){alert("Non sono riuscito a leggere automaticamente il link. Inserisci il luogo manualmente.");return}
  }else{
    q=prompt("Località/indirizzo per posizionarlo sulla mappa:",first)||first;
  }
  const payload={name,query:q};if(lat&&lon){payload.lat=lat;payload.lon=lon}
  const {data,error}=await sb.from("places").insert(payload).select().single();
  if(error){alert("Errore: "+error.message);return}
  places.push(data);buildSmartFilters();sortByNovara();render();
  if(!lat||!lon)await geocodeNew(data);else addMarker(data);
});
function syncMenuButton(){
  const panel=document.querySelector("#panel"),btn=document.querySelector("#openPanel");
  if(window.innerWidth<=760)btn.style.display=panel.classList.contains("closed")?"block":"none";
  else btn.style.display="none";
}
function syncMenuButton(){
  const panel=document.querySelector("#panel");
  const btn=document.querySelector("#openPanel");
  btn.style.display=(window.innerWidth<=760&&panel.classList.contains("closed"))?"block":"none";
}
document.querySelector("#closePanel").addEventListener("click",()=>{
  document.querySelector("#panel").classList.add("closed");
  syncMenuButton();
  setTimeout(()=>map.invalidateSize(),260);
});
document.querySelector("#openPanel").addEventListener("click",()=>{
  document.querySelector("#panel").classList.remove("closed");
  syncMenuButton();
  setTimeout(()=>map.invalidateSize(),260);
});
if(window.innerWidth<=760){
  document.querySelector("#panel").classList.add("closed");
  syncMenuButton();
  setTimeout(()=>map.invalidateSize(),50);
}
window.addEventListener("resize",syncMenuButton);
syncMenuButton();
window.addEventListener("resize",syncMenuButton);
syncMenuButton();
load();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v=2",{updateViaCache:"none"}).catch(()=>{}))}
</script>
</body>
</html>
